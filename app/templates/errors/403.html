{% extends "base.html" %}

{% block title %}Access Denied (403) — CodeCrews{% endblock %}

{% block content %}
<section class="ftco-section bg-dark text-light py-5">
  <div class="container py-5 text-center">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card bg-white text-dark shadow-lg rounded-lg border-0 p-5" data-aos="fade-up">
          <div class="display-3 text-danger mb-4"><i class="fas fa-shield-alt"></i></div>
          <h1 class="display-4 font-weight-bold mb-2">403</h1>
          <h2 class="h4 font-weight-bold mb-3">Access Denied</h2>
          <p class="text-muted mb-4">
            You do not have permission to view or access this resource. If you believe this is an error, please contact your administrator.
          </p>
          <a href="{{ url_for('public.index') }}" class="btn btn-warning font-weight-bold text-dark px-4 py-2">
            Return to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
