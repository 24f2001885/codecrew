{% extends "base.html" %}

{% block title %}500 — Something Went Wrong | CodeCrews{% endblock %}

{% block content %}
<section class="ftco-section d-flex align-items-center" style="min-height: 70vh; background-color: #0b1120;">
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h1 class="display-1 font-weight-bold text-warning mb-3">500</h1>
        <h2 class="h3 text-white font-weight-bold mb-4">Something went wrong on our side</h2>
        <p class="text-muted lead mb-5">
          We encountered an unexpected error while processing your request. Please try again in a few moments.
        </p>
        <div>
          <a href="{{ url_for('public.index') }}" class="btn btn-warning px-4 py-3 font-weight-bold">
            Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
