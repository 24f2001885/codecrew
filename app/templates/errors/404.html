{% extends "base.html" %}

{% block title %}404 — Page Not Found | CodeCrews{% endblock %}

{% block content %}
<section class="ftco-section d-flex align-items-center" style="min-height: 70vh; background-color: #0b1120;">
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h1 class="display-1 font-weight-bold text-warning mb-3">404</h1>
        <h2 class="h3 text-white font-weight-bold mb-4">We can't find that page</h2>
        <p class="text-muted lead mb-5">
          The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('public.index') }}" class="btn btn-warning px-4 py-3 font-weight-bold mr-3">
            Back to Home
          </a>
          <a href="{{ url_for('public.groups') }}" class="btn btn-outline-light px-4 py-3 font-weight-bold">
            Browse Groups
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
