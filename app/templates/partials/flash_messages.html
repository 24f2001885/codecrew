{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container mt-3 flash-container">
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category in ('error', 'danger') else ('success' if category == 'success' else ('warning' if category == 'warning' else 'info')) }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
