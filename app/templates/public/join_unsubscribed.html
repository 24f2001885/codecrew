{% extends "base.html" %}

{% block title %}Unsubscribed — CodeCrews{% endblock %}

{% block content %}
<section class="ftco-section bg-dark text-light py-5">
  <div class="container py-5 text-center">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card bg-white text-dark shadow-lg rounded-lg border-0 p-5" data-aos="fade-up">
          <div class="display-3 text-info mb-4"><i class="fas fa-bell-slash"></i></div>
          <h2 class="font-weight-bold mb-3">You Have Been Unsubscribed</h2>
          <p class="text-muted mb-4">
            You will no longer receive project domain alerts at <strong>{{ application.email }}</strong>.
          </p>
          <p class="text-muted small mb-4">
            Changed your mind? <a href="{{ url_for('join.join') }}" class="font-weight-bold text-primary">Re-apply any time</a>.
          </p>
          <a href="{{ url_for('public.index') }}" class="btn btn-outline-dark px-4 py-2 font-weight-bold">
            Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
