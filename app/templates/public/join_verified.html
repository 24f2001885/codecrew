{% extends "base.html" %}

{% block title %}Email Verified — CodeCrews{% endblock %}

{% block content %}
<section class="ftco-section bg-dark text-light py-5">
  <div class="container py-5 text-center">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card bg-white text-dark shadow-lg rounded-lg border-0 p-5" data-aos="fade-up">
          <div class="display-3 text-success mb-4"><i class="fas fa-check-circle"></i></div>
          <h2 class="font-weight-bold mb-3">Email Verified!</h2>
          <p class="lead text-muted mb-4">
            You're on our radar. The platform admin will review your profile, and we will email you when matching projects in your domain arrive.
          </p>
          <a href="{{ url_for('public.index') }}" class="btn btn-warning font-weight-bold text-dark px-4 py-2">
            Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
