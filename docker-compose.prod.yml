version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecrews}
      POSTGRES_USER: ${POSTGRES_USER:-codecrews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecrews_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codecrews} -d ${POSTGRES_DB:-codecrews}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codecrews}:${POSTGRES_PASSWORD:-codecrews_secret}@db:5432/${POSTGRES_DB:-codecrews}
      - FLASK_ENV=production
      - SESSION_COOKIE_SECURE=True
      - TRUSTED_PROXY_COUNT=1
    volumes:
      - private_uploads:/code/instance/private_uploads
      - static_assets:/code/app/static:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - static_assets:/app/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  private_uploads:
  static_assets:
