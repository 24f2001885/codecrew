version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codecrew-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecrews}
      POSTGRES_USER: ${POSTGRES_USER:-codecrews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecrews_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codecrews} -d ${POSTGRES_DB:-codecrews}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: codecrew-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codecrews}:${POSTGRES_PASSWORD:-codecrews_secret_2026}@db:5432/${POSTGRES_DB:-codecrews}
      - FLASK_ENV=production
      - SESSION_COOKIE_SECURE=True
      - TRUSTED_PROXY_COUNT=1
      - APP_BASE_URL=https://codecrew.abhishekpathak.site
      - SERVER_NAME=codecrew.abhishekpathak.site
    command: ["gunicorn", "-w", "2", "--threads", "2", "-b", "0.0.0.0:5000", "wsgi:app"]
    volumes:
      - private_uploads:/code/instance/private_uploads
      - public_uploads:/code/app/static/uploads
    deploy:
      resources:
        limits:
          memory: 220M
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5003:5000"

volumes:
  postgres_data:
  private_uploads:
  public_uploads:
